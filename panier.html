<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre panier — Kit Lagon</title>
<meta name="description" content="Récapitulatif de votre réservation Kit Lagon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lagoon-deep:#0B4F4A;
    --lagoon-bright:#1B8A82;
    --sand:#F1E6CE;
    --sand-light:#FAF5E9;
    --coral:#E8622E;
    --ink:#132420;
    --ink-soft:rgba(19,36,32,0.7);
    --line:rgba(19,36,32,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand-light);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 0.4em 0;letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 28px;}

  header{border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;max-width:760px;margin:0 auto;padding-left:28px;padding-right:28px;}
  .logo{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
  .logo-mark{width:26px;height:26px;flex:none;}
  .back-link{font-size:0.88rem;text-decoration:none;color:var(--ink-soft);}
  .back-link:hover{color:var(--ink);}

  main{padding:48px 0 80px;}
  h1{font-size:1.7rem;margin-bottom:6px;}
  .subtitle{color:var(--ink-soft);font-size:0.95rem;margin-bottom:32px;}

  .dates-summary{
    display:flex;gap:24px;background:var(--sand);border-radius:12px;padding:16px 20px;margin-bottom:28px;
    font-size:0.9rem;flex-wrap:wrap;
  }
  .dates-summary div strong{display:block;font-size:0.78rem;color:var(--ink-soft);font-weight:500;margin-bottom:2px;}

  .cart-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 0;border-bottom:1px solid var(--line);gap:14px;
  }
  .cart-item-name{font-weight:500;font-size:0.96rem;}
  .cart-item-meta{color:var(--ink-soft);font-size:0.82rem;margin-top:3px;}
  .cart-item-price{text-align:right;white-space:nowrap;font-size:0.94rem;}
  .cart-item-remove{background:none;border:none;color:var(--coral);cursor:pointer;font-size:0.8rem;text-decoration:underline;font-family:inherit;margin-top:4px;display:block;}

  .cart-total{display:flex;justify-content:space-between;padding-top:18px;font-size:1.1rem;font-weight:500;}
  .caution-note{font-size:0.82rem;color:var(--coral);margin-top:6px;}

  .contact-panel{background:var(--sand-light);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:32px;}
  .contact-panel h3{font-size:1.02rem;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:0.92rem;background:white;color:var(--ink);}

  .btn{display:inline-block;padding:13px 24px;border-radius:100px;text-decoration:none;font-weight:500;font-size:0.94rem;border:none;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--coral);color:white;}
  .send-btn{width:100%;text-align:center;margin-top:6px;}
  .form-note{font-size:0.78rem;color:var(--ink-soft);margin-top:10px;}

  .empty-state{padding:60px 0;text-align:center;color:var(--ink-soft);}
  .empty-state a{color:var(--coral);text-decoration:underline;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">
      <svg class="logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" stroke="#0B4F4A" stroke-width="1.6"/>
        <path d="M4 15c2.5 2 5 2 7.5 0s5-2 7.5 0 5 2 7.5 0" stroke="#1B8A82" stroke-width="1.6" fill="none"/>
        <path d="M4 19c2.5 2 5 2 7.5 0s5-2 7.5 0 5 2 7.5 0" stroke="#E8622E" stroke-width="1.4" fill="none" opacity="0.8"/>
      </svg>
      Kit Lagon
    </a>
    <a class="back-link" href="index.html">← Continuer mes achats</a>
  </div>
</header>

<main>
  <div class="wrap" id="content"></div>
</main>

<script>
  var catalogue = [];

  function findItem(id){
    for (var i = 0; i < catalogue.length; i++){
      if (catalogue[i].id === id) return catalogue[i];
    }
    return null;
  }

  function getTierIndex(days){
    if (days === null) return null;
    if (days <= 2) return 0;
    if (days <= 5) return 1;
    return 2;
  }

  function computeLineTotal(id, qty, unit, mult){
    return Math.round(unit * mult * qty * 100) / 100;
  }

  function flattenCatalogue(groups){
    var flat = [];
    groups.forEach(function (g) {
      g.items.forEach(function (item) { flat.push(item); });
    });
    return flat;
  }

  document.getElementById("content").innerHTML = '<p style="color:var(--ink-soft);">Chargement...</p>';
  fetch("products.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      catalogue = flattenCatalogue(data.groups);
      var promoCodes = data.promoCodes || [];

      var params = new URLSearchParams(window.location.search);
      var retrait = params.get("retrait") || "";
      var retour = params.get("retour") || "";

      var lines = [];
      try {
        var raw = JSON.parse(params.get("cart") || "[]");
        raw.forEach(function (l) {
          if (l && l.id && findItem(l.id) && l.qty > 0){
            lines.push({ id: l.id, sizes: l.sizes || {}, qty: l.qty });
          }
        });
      } catch (e) { lines = []; }

      var days = null;
      if (retrait && retour){
        var d1 = new Date(retrait);
        var d2 = new Date(retour);
        var diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        if (diff > 0) days = diff;
      }
      var tierIndex = getTierIndex(days);

      function idTotalQty(id){
        var t = 0;
        lines.forEach(function (l) { if (l.id === id) t += l.qty; });
        return t;
      }

      function removeLine(index){
        lines.splice(index, 1);
        var newParams = new URLSearchParams();
        if (lines.length) newParams.set("cart", JSON.stringify(lines));
        if (retrait) newParams.set("retrait", retrait);
        if (retour) newParams.set("retour", retour);
        window.location.search = newParams.toString();
      }

      function formatDate(iso){
        if (!iso) return "à préciser";
        var d = new Date(iso);
        return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
      }

      var appliedPromo = null;

      function findValidPromo(codeInput){
        var code = codeInput.trim().toUpperCase();
        var match = promoCodes.filter(function (p) { return p.code.toUpperCase() === code; })[0];
        if (!match) return { error: "Code promo introuvable." };
        if (!retrait) return { error: "Choisissez d'abord vos dates sur la page précédente pour vérifier ce code." };
        if (retrait < match.from || retrait > match.to) return { error: "Ce code n'est valable que pour une location débutant entre le " + formatDate(match.from) + " et le " + formatDate(match.to) + "." };
        return { promo: match };
      }

      function render(){
        var content = document.getElementById("content");

        if (lines.length === 0){
          content.innerHTML =
            '<div class="empty-state"><h1>Votre panier est vide</h1>' +
            '<p>Ajoutez des kits depuis <a href="index.html#catalogue">le catalogue</a>.</p></div>';
          return;
        }

        var itemsHtml = "";
        var total = 0;
        var totalCaution = 0;

        lines.forEach(function (line, idx) {
          var item = findItem(line.id);
          var qty = line.qty;
          var unit = tierIndex === null ? item.prices[2] : item.prices[tierIndex];
          var mult = tierIndex === null ? 1 : days;
          var itemLineTotal = computeLineTotal(line.id, idTotalQty(line.id), unit, mult) * (qty / idTotalQty(line.id));
          itemLineTotal = Math.round(itemLineTotal * 100) / 100;
          total += itemLineTotal;
          totalCaution += item.caution * qty;

          var sizeText = (line.sizes && Object.keys(line.sizes).length) ? " · " + Object.values(line.sizes).join(" · ") : "";
          var metaText = tierIndex === null
            ? "Quantité : " + qty + sizeText + " · dès " + unit + " €/jour (choisissez vos dates pour le tarif exact)"
            : "Quantité : " + qty + sizeText + " · " + unit + " €/jour × " + days + " jour" + (days > 1 ? "s" : "");

          itemsHtml += '<div class="cart-item">' +
            '<div><div class="cart-item-name">' + item.name + '</div>' +
            '<div class="cart-item-meta">' + metaText + '</div>' +
            '<button type="button" class="cart-item-remove" data-remove="' + idx + '">Retirer</button></div>' +
            '<div class="cart-item-price">' + itemLineTotal + ' €</div>' +
            '</div>';
        });

        var subtotal = Math.round(total * 100) / 100;
        var finalTotal = subtotal;
        var promoLineHtml = "";
        if (appliedPromo){
          finalTotal = Math.round(subtotal * (1 - appliedPromo.discount) * 100) / 100;
          promoLineHtml = '<div class="cart-total" style="font-size:0.9rem;color:var(--lagoon-deep);"><span>Code ' + appliedPromo.code + ' (-' + Math.round(appliedPromo.discount * 100) + '%)</span><span>−' + (Math.round((subtotal - finalTotal) * 100) / 100) + ' €</span></div>';
        }

        var promoBlockHtml = appliedPromo
          ? '<p class="form-note">Code promo <strong>' + appliedPromo.code + '</strong> appliqué. <button type="button" id="promo-remove" style="background:none;border:none;color:var(--coral);text-decoration:underline;cursor:pointer;font-family:inherit;">Retirer</button></p>'
          : '<div class="field" style="display:flex;gap:8px;align-items:flex-end;">' +
              '<div style="flex:1;"><label for="promo-input" style="display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;">Code promo</label><input type="text" id="promo-input"></div>' +
              '<button type="button" class="btn btn-secondary" id="promo-apply" style="background:var(--sand);white-space:nowrap;">Appliquer</button>' +
            '</div><p class="caution-note" id="promo-error" style="display:none;"></p>';

        var datesSummary = '<div class="dates-summary">' +
          '<div><strong>Retrait</strong>' + formatDate(retrait) + '</div>' +
          '<div><strong>Retour</strong>' + formatDate(retour) + '</div>' +
          (days ? '<div><strong>Durée</strong>' + days + ' jour' + (days > 1 ? "s" : "") + '</div>' : '') +
          '</div>';

        content.innerHTML =
          '<h1>Votre panier</h1>' +
          '<p class="subtitle">Vérifiez votre sélection avant d\u2019envoyer votre demande.</p>' +
          datesSummary +
          itemsHtml +
          '<div class="cart-total"><span>Sous-total' + (tierIndex === null ? ' (estimation)' : '') + '</span><span>' + subtotal + ' €</span></div>' +
          promoLineHtml +
          (appliedPromo ? '<div class="cart-total"><span>Total</span><span>' + finalTotal + ' €</span></div>' : '') +
          '<p class="caution-note">+ ' + totalCaution + ' € de caution (pré-autorisation par carte à la remise)</p>' +
          '<div class="contact-panel">' +
            '<h3>Code promo</h3>' +
            promoBlockHtml +
          '</div>' +
          '<div class="contact-panel">' +
            '<h3>Vos coordonnées</h3>' +
            '<div class="field"><label for="client-nom">Nom</label><input type="text" id="client-nom" placeholder="Votre nom"></div>' +
            '<div class="field"><label for="client-email">E-mail</label><input type="email" id="client-email" placeholder="vous@exemple.com"></div>' +
            '<div class="field" style="margin-bottom:0;"><label for="client-message">Message (optionnel)</label><textarea id="client-message" rows="3" placeholder="Précisions, horaire souhaité..."></textarea></div>' +
            '<button class="btn btn-primary send-btn" id="send-btn">Envoyer la demande de réservation</button>' +
            '<p class="form-note">Ouvre votre messagerie avec un e-mail pré-rempli vers Kit Lagon. La réservation en ligne avec paiement arrivera dans une prochaine version.</p>' +
          '</div>';

        content.querySelectorAll("[data-remove]").forEach(function (btn) {
          btn.addEventListener("click", function () { removeLine(parseInt(btn.getAttribute("data-remove"), 10)); });
        });

        var promoApplyBtn = document.getElementById("promo-apply");
        if (promoApplyBtn){
          promoApplyBtn.addEventListener("click", function () {
            var result = findValidPromo(document.getElementById("promo-input").value || "");
            var errEl = document.getElementById("promo-error");
            if (result.error){
              errEl.textContent = result.error;
              errEl.style.display = "block";
            } else {
              appliedPromo = result.promo;
              render();
            }
          });
        }
        var promoRemoveBtn = document.getElementById("promo-remove");
        if (promoRemoveBtn){
          promoRemoveBtn.addEventListener("click", function () { appliedPromo = null; render(); });
        }

        document.getElementById("send-btn").addEventListener("click", function () {
          var nom = document.getElementById("client-nom").value.trim();
          var email = document.getElementById("client-email").value.trim();
          var message = document.getElementById("client-message").value.trim();

          var mailLines = lines.map(function (line) {
            var item = findItem(line.id);
            var qty = line.qty;
            var unit = tierIndex === null ? item.prices[2] : item.prices[tierIndex];
            var sizeNote = (line.sizes && Object.keys(line.sizes).length) ? " (" + Object.values(line.sizes).join(", ") + ")" : "";
            return "- " + item.name + sizeNote + " x" + qty + " (" + unit + " €/jour, caution " + item.caution + " €)";
          });

          var bodyParts = [
            "Bonjour Kit Lagon,",
            "",
            "Je souhaite réserver :",
            mailLines.join("\n"),
            "",
            appliedPromo ? ("Code promo : " + appliedPromo.code + " (-" + Math.round(appliedPromo.discount * 100) + "%)") : "",
            "Date de retrait : " + (retrait || "à préciser"),
            "Date de retour : " + (retour || "à préciser"),
            "",
            "Nom : " + (nom || "à préciser"),
            "E-mail : " + (email || "à préciser"),
            message ? ("Message : " + message) : ""
          ].filter(Boolean);

          var subject = encodeURIComponent("Demande de réservation Kit Lagon");
          var body = encodeURIComponent(bodyParts.join("\n"));
          window.location.href = "mailto:contact@kitlagon.re?subject=" + subject + "&body=" + body;
        });
      }

      render();
    })
    .catch(function () {
      document.getElementById("content").innerHTML = '<p style="color:var(--coral);">Impossible de charger le panier pour le moment.</p>';
    });
</script>
</body>
</html>
